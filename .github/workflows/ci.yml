name: Foundation checks

on:
  push:
    branches:
      - main
      - "jolly/**"
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Offline tests
        run: python -m pytest -q
      - name: CLI smoke
        run: python -m kneekura_web --help
