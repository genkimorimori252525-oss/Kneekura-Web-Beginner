[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kneekura-web-beginner"
version = "0.1.0"
description = "Evidence-first web analysis and integration research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
browser = ["playwright>=1.48,<2"]
documents = ["markitdown>=0.1.8,<1"]
crawl4ai = ["crawl4ai>=0.9,<1"]

[project.scripts]
kneekura-web = "kneekura_web.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
